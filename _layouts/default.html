<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a href="{{ '/' | relative_url }}" class="site-logo-link">
        <img src="{{ '/assets/images/favicon.png' | relative_url }}" alt="BA Logo" class="site-logo">
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/experience' | relative_url }}" {% if page.url contains 'experience' %}class="active"{% endif %}>Experience</a>
        <a href="{{ '/education' | relative_url }}" {% if page.url contains 'education' %}class="active"{% endif %}>Education</a>
        <a href="{{ '/publications' | relative_url }}" {% if page.url contains 'publications' %}class="active"{% endif %}>Publications</a>
        <a href="{{ '/contact' | relative_url }}" {% if page.url contains 'contact' %}class="active"{% endif %}>Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: "%Y" }} Beatriz Antunes | Built with <a href="https://github.com/pages-themes/primer" target="_blank">Jekyll Primer theme</a></p>
    </div>
  </footer>
</body>
</html>
